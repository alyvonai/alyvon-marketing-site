<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;background:#0b0d11;overflow:hidden}
  body{font-family:Archivo,Arial,sans-serif;color:#f6f7f9;position:relative;
    background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
    background-size:48px 48px}
  .glow{position:absolute;inset:0;background:radial-gradient(55% 60% at 85% 110%,rgba(222,75,18,.35),transparent 70%)}
  .wrap{position:absolute;inset:0;padding:72px 80px;display:flex;flex-direction:column}
  .logo{display:flex;align-items:center;gap:16px}
  .word{font-weight:700;font-size:30px;letter-spacing:.12em}
  .eyebrow{margin-top:auto;font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:#de4b12;display:flex;align-items:center;gap:12px}
  .dot{width:8px;height:8px;border-radius:50%;background:#de4b12}
  h1{margin:22px 0 0;font-size:86px;line-height:1.02;letter-spacing:-.045em;font-weight:700}
  .accent{color:#de4b12}
  .foot{margin-top:34px;font-size:24px;color:rgba(246,247,249,.72)}
</style></head><body><div class="glow"></div><div class="wrap">
  <div class="logo">
    <svg width="54" height="45" viewBox="0 0 161 135"><path fill="#f6f7f9" fill-rule="evenodd" d="M80 0 160 134 1 134Z M80 34 110 85 51 85Z M40 107 121 107 135 134 26 134Z"/><path fill="#de4b12" d="M80 56 90 74 70 74Z"/></svg>
    <span class="word">ALYVON</span>
  </div>
  <div class="eyebrow"><span class="dot"></span>The AI workforce for AI agencies</div>
  <h1>From discovery to building.<br>In <span class="accent">days,</span> not weeks.</h1>
  <div class="foot">Stakeholder interviews · Data readiness · Signed scopes · Custom agents</div>
</div></body></html>
